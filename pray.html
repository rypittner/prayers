<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP Prayer Intentions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yrsa:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://focus.org/wp-content/uploads/2023/03/cropped-focusicon-32x32.png">
    <style>
        /* CSS VARIABLES FOR MODERN, LIGHT THEME */
        :root {
            --bg-color: #EEECE9; /* Cream / Off White */
            --primary-accent: #00437A; /* Muted Blue */
            --secondary-accent: #CAAC5C; /* Muted Gold (for highlights/counters) */
            --header-font: 'Yrsa', serif;
            --body-font: 'Inter', sans-serif;
            --text-color: #333333;
            --card-bg: #FFFFFF;
            --radius-main: 16px;
            --radius-btn: 50px;
            --radius-input: 8px;
            --shadow-subtle: 0 4px 15px rgba(0,0,0,0.05);
            --transition-speed: 0.3s;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--body-font);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* Prevent body scroll */
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 0 30px;
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* HEADER SECTION */
        header {
            padding-top: 10px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        header hr {
            width: 100%;
            border: 0;
            border-top: 2px solid var(--primary-accent);
            opacity: 0.2;
            margin-top: 10px;
            padding: 0;
            margin-bottom: 0;
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px; /* Aligned height */
        }

        .header-bottom-row {
            display: none; /* Hidden on desktop, enabled via mobile media query */
        }

        /* LOGO, MULTI-SELECT TOGGLE AREA & STICKING PILL */
        .header-left-group {
            display: flex;
            align-items: center;
            position: relative;
            width: 250px; /* Fixed anchor width so desktop menu stays centered */
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            height: 40px;
            position: relative;
            z-index: 2;
        }

        #logoIMG {
            padding-left: 20px;
            transform: scale(0.8, 0.8);
            transition: transform 0.2s;
            height: 40px;
            object-fit: contain;
        }

        .active-logo-check {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-accent);
            margin-left: 20px;
            background-color: #FFFFFF;
            border: 2px solid var(--primary-accent);
            border-radius: 50%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .bulk-action-inline {
            font-family: var(--body-font);
            font-size: 0.85em;
            font-weight: 600;
            color: var(--primary-accent);
            background: var(--card-bg);
            border: 1px solid #DDDDDD;
            border-left: none; /* Remove left border so it merges seamlessly into the circle */
            padding: 0 16px 0 24px; 
            height: 40px;
            border-top-right-radius: var(--radius-btn);
            border-bottom-right-radius: var(--radius-btn);
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            cursor: pointer;
            box-shadow: var(--shadow-subtle);
            transition: background var(--transition-speed);
            display: none;
            white-space: nowrap;
            align-items: center;
            margin-left: -20px; /* Pulls pill left so it tucks neatly underneath/behind the circular edge */
            z-index: 1;
        }

        .bulk-action-inline:hover {
            background-color: #f0f4f8;
        }

        /* TAB SELECTOR STYLING (Desktop) */
        .tab-selector-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: var(--card-bg);
            border: 1px solid #DDDDDD;
            border-radius: var(--radius-btn);
            padding: 4px;
            box-shadow: var(--shadow-subtle);
            height: 40px;
            box-sizing: border-box;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .tab-btn {
            font-family: var(--body-font);
            font-size: 0.85em;
            font-weight: 600;
            color: #777777;
            background: transparent;
            border: none;
            border-radius: var(--radius-btn);
            padding: 0 16px;
            height: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all var(--transition-speed);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-btn.active {
            background-color: var(--primary-accent);
            color: #FFFFFF;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* MAIN ACTION BUTTON */
        .header-right-group {
            width: 250px;
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        #addPrayerBtn {
            font-family: var(--body-font);
            font-weight: 600;
            background-color: #6CA6C1;
            color: #FFFFFF;
            border: none;
            padding: 0;
            width: 40px;
            height: 40px;
            font-size: 1.2em;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background var(--transition-speed), transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            z-index: 100;
        }

        #addPrayerBtn:hover {
            background-color: #5893ae;
        }

        #addPrayerBtn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* CARD VIEW AREA */
        #prayerCardsView {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            flex-grow: 1;
            overflow-y: auto; /* Cards will scroll independently */
            padding-bottom: 40px;
            padding-top: 20px;
            scrollbar-width: none; /* Firefox */
        }

        /* Hide scrollbar */
        #prayerCardsView::-webkit-scrollbar {
            display: none;
        }

        /* PRAYER REQUEST CARDS */
        .prayer-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-main);
            padding: 30px;
            box-shadow: var(--shadow-subtle);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 350px; /* Standardized height */
            min-width: 0; 
            width: 100%;
            box-sizing: border-box;
            transition: transform 0s, opacity 0s, border 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
            cursor: default;
        }

        .prayer-card.selectable {
            cursor: pointer;
        }

        .prayer-card.selected-card {
            border: 2px solid #888888;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .prayer-card.depth-chart-card {
            height: 180px;
            min-height: 180px;
            max-height: 180px;
            padding: 20px 30px;
        }

        .card-header {
            margin-bottom: 10px;
        }

        .card-name {
            opacity: 0.8;
            font-family: Yrsa, serif;
            font-weight: 600;
            font-size: 2em;
            line-height: 1;
        }

        .card-date {
            font-size: 0.85em;
            color: #777;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.6pt;
            margin-bottom: 13px;
            opacity: 0.7;
        }

        .card-body {
            font-size: 1.3em;
            color: #555;
            opacity: 0.8;
            line-height: 1.4;
            margin-bottom: 15px;
            flex-grow: 1; 
            overflow-y: auto; 
            overflow-x: hidden;
            scrollbar-width: none;
        }
        .card-body::-webkit-scrollbar {
            display: none;
        }

        /* ACTION AREA */
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #EEEEEE;
            padding-top: 10px;
            margin-top: auto;
        }

        .prayer-card.depth-chart-card .card-actions {
            border-top: none;
            padding-top: 0;
            margin-top: auto;
        }

        /* MODAL (OVERLAY AND FORM) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            transition: opacity var(--transition-speed);
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: var(--radius-main);
            padding: 30px;
            width: 400px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal h2 {
            font-family: var(--header-font);
            color: var(--primary-accent);
            margin: 0;
        }

        /* MODAL FORM STYLING */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
        }

        input, textarea, select {
            padding: 10px;
            border: 1px solid #DDDDDD;
            border-radius: var(--radius-input);
            font-family: var(--body-font);
            font-size: 1em;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-accent);
        }

        /* DEPTH PILLS PICKER IN MODAL */
        .depth-picker-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .depth-option-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px solid #EEEEEE;
            border-radius: var(--radius-btn);
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6pt;
            transition: all 0.2s;
            user-select: none;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }

        .modal-left-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cancel-btn {
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-family: var(--body-font);
            font-weight: 600;
            padding: 10px 16px;
            transition: color var(--transition-speed);
        }

        .cancel-btn:hover {
            color: #555;
        }

        .delete-btn-modal {
            background: none;
            border: none;
            color: #EE4B2B;
            cursor: pointer;
            font-family: var(--body-font);
            font-weight: 600;
            padding: 10px 0px;
            transition: opacity var(--transition-speed);
        }
        .delete-btn-modal:hover {
            opacity: 0.8;
        }

        .confirm-btn {
            background-color: var(--primary-accent);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            font-size: 0.95em;
            border-radius: var(--radius-btn);
            cursor: pointer;
            font-family: var(--body-font);
            font-weight: 600;
            transition: background var(--transition-speed);
        }

        .confirm-btn:hover {
            background-color: #6A8790;
        }

        .archive-checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background-color: #FAFAF9;
            border-radius: var(--radius-input);
            margin-top: 10px;
        }

        .archive-checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .archive-checkbox-group label {
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .archive-checkbox-group label svg {
            width: 16px;
            height: 16px;
            color: #EE4B2B;
        }

        /* GENERIC BUTTONS (ACTION BUTTONS ON CARDS) */
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #888888;
            transition: color var(--transition-speed);
            padding: 5px;
            display: flex;
            align-items: center;
            z-index: 5;
        }

        .edit-btn:hover { color: #555; }

        /* PRAYED COUNTER */
        .prayed-counter {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px solid #EEEEEE;
            border-radius: var(--radius-btn);
            padding: 6px 16px;
            color: #888888;
            cursor: pointer;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
            z-index: 5;
        }

        .prayed-counter span {
            text-transform: uppercase;
            letter-spacing: 0.6pt;
        }
        
        /* UTILITY */
        .hidden { display: none; }

        /* MOBILE RESPONSIVE FIXES */
        @media (max-width: 768px) {
            .container {
                padding: 0 0px;
            }
            header {
                padding-bottom: 5px;
            }
            .header-top-row {
                padding: 0 10px;
            }
            /* Hide absolute centered desktop menu on mobile and use second row instead */
            .header-top-row .tab-selector-container {
                display: none;
            }
            .header-left-group {
                width: auto; /* Prevent fixed desktop width from cutting off plus button on mobile */
            }
            .header-right-group {
                width: auto;
            }
            .header-bottom-row {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 10px;
                padding: 0 10px;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .header-bottom-row::-webkit-scrollbar {
                display: none;
            }
            .header-bottom-row .tab-selector-container {
                position: static;
                transform: none;
                width: 100%;
                justify-content: space-between;
                display: flex !important;
            }
            .tab-btn {
                flex: 1;
                text-align: center;
                padding: 0 10px;
                font-size: 0.75em;
                letter-spacing: 0.5px;
            }
            #prayerCardsView {
                display: grid;
                grid-template-columns: 1fr;
                padding: 20px 20px 50px 20px;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
<header>
    <div class="header-top-row">
        <div class="header-left-group">
            <div class="logo-area" id="logoToggleArea" title="Toggle Bulk Selection Mode">
                <img id="logoIMG" src="https://focus.org/wp-content/uploads/2023/03/cropped-focusicon-192x192.png" alt="Logo">
                <div id="activeLogoCheckContainer" class="active-logo-check hidden">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--primary-accent)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
            </div>
            <button class="bulk-action-inline" id="bulkArchiveBtn">Archive Selected</button>
        </div>

        <div class="tab-selector-container" id="tabSelector">
            <button class="tab-btn" data-view="mpd">MPD</button>
            <button class="tab-btn active" data-view="depth_chart">Depth Chart</button>
            <button class="tab-btn" data-view="personal">Personal</button>
        </div>

        <div class="header-right-group">
            <button id="addPrayerBtn" title="Add New Prayer">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </div>
    </div>

    <div class="header-bottom-row">
        <div class="tab-selector-container" id="tabSelectorMobile">
            <button class="tab-btn" data-view="mpd">MPD</button>
            <button class="tab-btn active" data-view="depth_chart">Depth Chart</button>
            <button class="tab-btn" data-view="personal">Personal</button>
        </div>
    </div>
    <hr>
</header>
    <div id="prayerCardsView"></div>
</div>

<div id="prayerModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">New Prayer Request</h2>
        <input type="hidden" id="editIndex"> 
        
        <div class="input-group" id="standardFormFields">
            <div class="input-group" style="margin-bottom: 15px;">
                <label for="pName">Requester Name</label>
                <input type="text" id="pName" placeholder="Name or Initials">
            </div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label for="pDate">Date</label>
                <input type="date" id="pDate">
            </div>
            <div class="input-group">
                <label for="pRequest">Prayer Request</label>
                <textarea id="pRequest" rows="4" placeholder="Your intention here..."></textarea>
            </div>
        </div>

        <div class="input-group" id="depthChartFormFields" style="display: none;">
            <div class="input-group" style="margin-bottom: 15px;">
                <label for="dcName">Name</label>
                <input type="text" id="dcName" placeholder="Contact Name">
            </div>
            <div class="input-group">
                <label>Depth</label>
                <div class="depth-picker-group" id="depthPickerGroup">
                    <div class="depth-option-pill" data-depth="New Contact">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>New Contact</span>
                    </div>
                    <div class="depth-option-pill" data-depth="Meaningful">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span>Meaningful</span>
                    </div>
                    <div class="depth-option-pill" data-depth="B-Study">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
                        <span>B-Study</span>
                    </div>
                    <div class="depth-option-pill" data-depth="Disciple">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        <span>Disciple</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="archive-checkbox-group" id="archiveGroup" style="display: none;">
            <input type="checkbox" id="pArchived">
            <label for="pArchived">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
                Archive this prayer request
            </label>
        </div>
        <div class="form-actions">
            <div class="modal-left-actions">
                <button class="cancel-btn" id="closeModal">Cancel</button>
                <button class="delete-btn-modal hidden" id="deleteModalBtn">Delete</button>
            </div>
            <button id="submitPrayerBtn" class="confirm-btn">Save</button> 
        </div>
    </div>
</div>

<script>
    const modal = document.getElementById('prayerModal');
    const openBtn = document.getElementById('addPrayerBtn');
    const closeBtn = document.getElementById('closeModal');
    const submitBtn = document.getElementById('submitPrayerBtn'); 
    const deleteModalBtn = document.getElementById('deleteModalBtn');
    const viewArea = document.getElementById('prayerCardsView');
    const tabSelector = document.getElementById('tabSelector');
    const tabSelectorMobile = document.getElementById('tabSelectorMobile');

    const nameInput = document.getElementById('pName');
    const dateInput = document.getElementById('pDate');
    const requestInput = document.getElementById('pRequest');
    const dcNameInput = document.getElementById('dcName');
    const editIndexInput = document.getElementById('editIndex');
    const modalTitle = document.getElementById('modalTitle');
    const archivedCheckbox = document.getElementById('pArchived');
    const archiveGroup = document.getElementById('archiveGroup');

    const standardFormFields = document.getElementById('standardFormFields');
    const depthChartFormFields = document.getElementById('depthChartFormFields');
    const depthPickerGroup = document.getElementById('depthPickerGroup');

    const logoToggleArea = document.getElementById('logoToggleArea');
    const logoIMG = document.getElementById('logoIMG');
    const activeLogoCheckContainer = document.getElementById('activeLogoCheckContainer');
    const bulkArchiveBtn = document.getElementById('bulkArchiveBtn');

    let allData = { mpd: [], personal: [], depth_chart: [] };
    let prayedCache = new Set();
    let selectedIndices = new Set();
    let selectedDepthValue = '';
    let currentView = localStorage.getItem('activePrayerTab') || 'depth_chart';
    let bulkSelectionActive = false;

    const BIN_ID = "6a9638f1f5f4af5e295a7630";
    const MASTER_KEY = "$2a$10$uWA6RwV4hxUT6D49HU56VuPjVsoNcHcTmf.jSgx.o6RXd2G1wGyse"; 
    const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const hexToRgba = (hex, alpha) => {
        let c = hex.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        const num = parseInt(c, 16);
        return `rgba(${num >> 16}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
    };

    const getDepthConfig = (depthName) => {
        const lower = (depthName || '').trim().toLowerCase();
        if (lower === 'new contact') {
            return { color: '#888888', bg: hexToRgba('#888888', 0.15), icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>` };
        } else if (lower === 'meaningful') {
            return { color: '#C9AB5C', bg: hexToRgba('#C9AB5C', 0.15), icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>` };
        } else if (lower === 'b-study') {
            return { color: '#6CA6C1', bg: hexToRgba('#6CA6C1', 0.15), icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>` };
        } else if (lower === 'disciple') {
            return { color: '#376D48', bg: hexToRgba('#376D48', 0.15), icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>` };
        }
        return { color: '#CAAC5C', bg: hexToRgba('#CAAC5C', 0.15), icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>` };
    };

    const updateTabUI = () => {
        const containers = [tabSelector, tabSelectorMobile];
        containers.forEach(container => {
            if (!container) return;
            container.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.view === currentView) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        });
    };

    const loadPrayers = async () => {
        try {
            const response = await fetch(BASE_URL, { headers: { "X-Master-Key": MASTER_KEY } });
            const result = await response.json();
            const record = result.record || {};
            if (Array.isArray(record)) {
                allData = { mpd: record, personal: [], depth_chart: [] };
            } else {
                allData = {
                    mpd: record.mpd || [],
                    personal: record.personal || [],
                    depth_chart: record.depth_chart || []
                };
            }
            updateTabUI();
            render();
        } catch (err) { console.error("Error loading data:", err); }
    };

    const persistToJSONbin = async () => {
        try {
            await fetch(BASE_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                body: JSON.stringify(allData)
            });
        } catch (err) { console.error("Error saving data:", err); }
    };

    const savePrayer = async () => {
        const editIndex = editIndexInput.value;
        const archived = archivedCheckbox.checked;

        if (currentView === 'depth_chart') {
            const name = dcNameInput.value.trim();
            if(!name) { alert('Please fill out the name field.'); return; }
            const finalRequest = selectedDepthValue || 'New Contact';

            if (!allData[currentView]) allData[currentView] = [];

            if (editIndex !== '') {
                allData[currentView][editIndex] = { ...allData[currentView][editIndex], name, request: finalRequest, archived };
            } else {
                allData[currentView].push({ name, date: new Date().toISOString().split('T')[0], request: finalRequest, lastPrayed: null, archived: false });
            }
        } else {
            const name = nameInput.value.trim();
            const date = dateInput.value;
            const request = requestInput.value;

            if(!name) { alert('Please fill out the name field.'); return; }
            const finalRequest = request.trim() === '' ? '' : request;

            if (!allData[currentView]) allData[currentView] = [];

            if (editIndex !== '') {
                allData[currentView][editIndex] = { ...allData[currentView][editIndex], name, date, request: finalRequest, archived };
            } else {
                allData[currentView].push({ name, date, request: finalRequest, lastPrayed: null, archived: false });
            }
        }

        selectedIndices.clear();
        await persistToJSONbin();
        closeModal();
        render();
    };

    const deletePrayer = async (index) => {
        if(!confirm("Are you sure you want to permanently delete this prayer request?")) return;
        allData[currentView].splice(index, 1);
        selectedIndices.clear();
        await persistToJSONbin();
        closeModal();
        render();
    };

    const markPrayed = async (index, cardElement) => {
        if (bulkSelectionActive) return; // Prevent praying during bulk mode selection
        allData[currentView][index].lastPrayed = new Date().toISOString();
        prayedCache.add(index);
        
        const firstPositions = capturePositions();
        render();
        flipAnimate(firstPositions);
        
        await persistToJSONbin();
    }

    const capturePositions = () => {
        const positions = {};
        viewArea.querySelectorAll('.prayer-card').forEach(card => {
            const id = card.dataset.id;
            const rect = card.getBoundingClientRect();
            positions[id] = { rect: rect };
        });
        return positions;
    }

    const flipAnimate = (firstPositions) => {
        const lastCards = viewArea.querySelectorAll('.prayer-card');
        lastCards.forEach(card => {
            const id = card.dataset.id;
            const firstState = firstPositions[id];
            if (!firstState) return;

            const firstRect = firstState.rect;
            const lastRect = card.getBoundingClientRect();
            const deltaX = firstRect.left - lastRect.left;
            const deltaY = firstRect.top - lastRect.top;

            if (deltaX === 0 && deltaY === 0) return;

            card.style.transition = 'none';
            card.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            requestAnimationFrame(() => {
                card.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
                card.style.transform = '';
            });
        });
    }

    const getRelativeTime = (timestamp) => {
        if (!timestamp) return "PRAY NOW";
        const now = new Date();
        const diff = now - new Date(timestamp);
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);

        if (minutes < 1) return "JUST NOW";
        if (minutes < 60) return `${minutes} MIN AGO`;
        if (hours < 24) return hours === 1 ? "1 HR AGO" : `${hours} HRS AGO`;
        if (days === 0) return "TODAY";
        return days === 1 ? "1 DAY AGO" : `${days} DAYS AGO`;
    };

    const getSortedPrayers = () => {
        const currentList = allData[currentView] || [];
        return currentList
            .map((p, i) => ({ ...p, originalIndex: i, id: `card-${i}` }))
            .filter(p => !p.archived)
            .sort((a, b) => {
                if (!a.lastPrayed && !b.lastPrayed) return 0;
                if (!a.lastPrayed) return -1;
                if (!b.lastPrayed) return 1;
                return new Date(a.lastPrayed) - new Date(b.lastPrayed);
            });
    }

    const updateBulkToolbar = () => {
        if (bulkSelectionActive) {
            logoIMG.classList.add('hidden');
            activeLogoCheckContainer.classList.remove('hidden');
            bulkArchiveBtn.style.display = 'flex';
            bulkArchiveBtn.innerText = `Archive Selected (${selectedIndices.size})`;
        } else {
            logoIMG.classList.remove('hidden');
            activeLogoCheckContainer.classList.add('hidden');
            bulkArchiveBtn.style.display = 'none';
        }
    };

    const render = () => {
        let firstPositions = capturePositions();
        viewArea.innerHTML = ''; 
        const sorted = getSortedPrayers();
        
        const prayedItems = sorted.filter(p => p.lastPrayed);
        const times = prayedItems.map(p => new Date(p.lastPrayed).getTime());
        const minTime = Math.min(...times);
        const maxTime = Math.max(...times);

        sorted.forEach((item) => {
            let opacity = 0;
            if (item.lastPrayed && currentView !== 'depth_chart') {
                const time = new Date(item.lastPrayed).getTime();
                opacity = maxTime === minTime ? 1 : (time - minTime) / (maxTime - minTime);
            }
            viewArea.appendChild(createCardMarkup(item, item.originalIndex, opacity, prayedCache.has(item.originalIndex), currentView));
        });
        flipAnimate(firstPositions);
        updateBulkToolbar();
    }

    const createCardMarkup = (prayer, index, opacity, isTempPrayed, viewType) => {
        const card = document.createElement('div');
        card.classList.add('prayer-card');
        if (bulkSelectionActive) {
            card.classList.add('selectable');
        }
        card.dataset.id = prayer.id;
        
        if (isTempPrayed) card.style.opacity = '0.5';
        if (selectedIndices.has(index)) {
            card.classList.add('selected-card');
        }

        const isDepthChart = viewType === 'depth_chart';
        if (isDepthChart) {
            card.classList.add('depth-chart-card');
        }
        
        const isNeverPrayed = !prayer.lastPrayed;
        let bgColor = 'transparent';
        let borderColor = '#EEEEEE';
        let textColor = '#888888';

        if (isDepthChart) {
            const cfg = getDepthConfig(prayer.request);
            borderColor = cfg.color;
            textColor = cfg.color;
            bgColor = cfg.bg;
        } else {
            bgColor = isNeverPrayed ? 'transparent' : `rgba(202, 172, 92, ${0.2 + (0.8 * opacity)})`;
            textColor = isNeverPrayed ? '#888888' : (opacity > 0.5 ? '#FFFFFF' : 'var(--secondary-accent)');
            borderColor = isNeverPrayed ? '#EEEEEE' : 'var(--secondary-accent)';
        }

        const pillText = isDepthChart ? (prayer.request || 'PRAY NOW') : getRelativeTime(prayer.lastPrayed);
        const pillIcon = isDepthChart ? getDepthConfig(prayer.request).icon : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
        
        card.innerHTML = `
            <div class="card-header"><div class="card-name">${escapeHtml(prayer.name)}</div></div>
            ${!isDepthChart ? `<div class="card-body">${escapeHtml(prayer.request)}</div>` : ''}
            ${!isDepthChart ? `<div class="card-date">${formatDate(prayer.date)}</div>` : ''}
            <div class="card-actions">
                <div class="prayed-counter" onclick="markPrayed(${index}, this.closest('.prayer-card'))" 
                     style="background-color: ${bgColor}; border-color: ${borderColor}; color: ${textColor}">
                    ${pillIcon}
                    <span>${escapeHtml(pillText)}</span>
                </div>
                <button class="icon-btn edit-btn" onclick="openEdit(${index})">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
            </div>
        `;

        card.onclick = (e) => {
            if (!bulkSelectionActive) return; // Only allow selection if bulk archive mode is enabled via the checkmark
            if (e.target.closest('.prayed-counter') || e.target.closest('.icon-btn')) return;
            
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
                card.classList.remove('selected-card');
            } else {
                selectedIndices.add(index);
                card.classList.add('selected-card');
            }
            updateBulkToolbar();
        };

        return card;
    }

    const setDepthPickerSelection = (depthVal) => {
        selectedDepthValue = depthVal || 'New Contact';
        depthPickerGroup.querySelectorAll('.depth-option-pill').forEach(pill => {
            const pDepth = pill.dataset.depth;
            const cfg = getDepthConfig(pDepth);
            if (pDepth.toLowerCase() === selectedDepthValue.toLowerCase()) {
                pill.style.backgroundColor = cfg.color;
                pill.style.color = '#FFFFFF';
                pill.style.borderColor = cfg.color;
            } else {
                pill.style.backgroundColor = 'transparent';
                pill.style.color = cfg.color;
                pill.style.borderColor = cfg.color;
            }
        });
    };

    const openModal = (editing = false) => {
        modal.style.display = 'flex';
        const isDepthChart = currentView === 'depth_chart';
        
        if (isDepthChart) {
            standardFormFields.style.display = 'none';
            depthChartFormFields.style.display = 'block';
        } else {
            standardFormFields.style.display = 'block';
            depthChartFormFields.style.display = 'none';
        }

        if(!editing) {
            dateInput.value = new Date().toISOString().split('T')[0];
            modalTitle.innerText = isDepthChart ? "New Depth Chart Contact" : "New Prayer Request";
            submitBtn.innerText = "Save";
            editIndexInput.value = ''; 
            archiveGroup.style.display = 'none'; 
            deleteModalBtn.classList.add('hidden');
            if (isDepthChart) setDepthPickerSelection('New Contact');
        } else {
            deleteModalBtn.classList.remove('hidden');
        }
    };

    const closeModal = () => {
        modal.style.display = 'none';
        nameInput.value = '';
        requestInput.value = '';
        dcNameInput.value = '';
        editIndexInput.value = '';
        archivedCheckbox.checked = false;
    };

    const openEdit = (index) => {
        const prayer = allData[currentView][index];
        modalTitle.innerText = currentView === 'depth_chart' ? "Edit Depth Chart Contact" : "Edit Prayer Request";
        submitBtn.innerText = "Update";
        editIndexInput.value = index;
        archivedCheckbox.checked = prayer.archived || false;
        archiveGroup.style.display = 'flex'; 

        if (currentView === 'depth_chart') {
            dcNameInput.value = prayer.name;
            setDepthPickerSelection(prayer.request);
        } else {
            nameInput.value = prayer.name;
            dateInput.value = prayer.date;
            requestInput.value = prayer.request;
        }

        openModal(true);
    };

    const formatDate = (dateStr) => {
        if(!dateStr) return "";
        return new Date(dateStr).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    const escapeHtml = (unsafe) => (unsafe || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

    // Event Listeners for Tabs
    const handleTabChange = (view) => {
        currentView = view;
        localStorage.setItem('activePrayerTab', currentView);
        selectedIndices.clear();
        bulkSelectionActive = false;
        updateTabUI();
        render();
    };

    tabSelector.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => handleTabChange(btn.dataset.view);
    });

    if (tabSelectorMobile) {
        tabSelectorMobile.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => handleTabChange(btn.dataset.view);
        });
    }

    // Logo click to toggle bulk mode
    logoToggleArea.onclick = () => {
        bulkSelectionActive = !bulkSelectionActive;
        if (!bulkSelectionActive) {
            selectedIndices.clear();
        }
        render();
    };

    // Depth Pills Selection click handling in Modal
    depthPickerGroup.querySelectorAll('.depth-option-pill').forEach(pill => {
        pill.onclick = () => {
            setDepthPickerSelection(pill.dataset.depth);
        };
    });

    // Bulk Archive
    bulkArchiveBtn.onclick = async () => {
        if (selectedIndices.size === 0) return;
        if (!confirm(`Are you sure you want to archive ${selectedIndices.size} selected item(s)?`)) return;
        
        selectedIndices.forEach(index => {
            if (allData[currentView][index]) {
                allData[currentView][index].archived = true;
            }
        });
        selectedIndices.clear();
        bulkSelectionActive = false;
        await persistToJSONbin();
        render();
    };

    openBtn.onclick = () => openModal();
    closeBtn.onclick = (e) => { e.preventDefault(); closeModal(); }; 
    submitBtn.onclick = (e) => { e.preventDefault(); savePrayer(); }; 
    deleteModalBtn.onclick = (e) => { e.preventDefault(); deletePrayer(editIndexInput.value); };
    window.onclick = (event) => { if (event.target == modal) closeModal(); };

    loadPrayers();
</script>
</body>
</html>
